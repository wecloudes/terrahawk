name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-latest moved to 26.04, which has no setup-python build of 3.9
    # (our minimum). 24.04 still does; bump when the 3.9 floor is raised.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: pip install -e .[test]
      - name: Run tests
        run: pytest -q

  report-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with test + browser extras
        run: pip install -e .[test,browser]
      - name: Install headless Chromium
        run: playwright install --with-deps chromium
      - name: Render the HTML report in every theme
        run: pytest -q -m browser

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (aws variant)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            CLOUD=aws
          push: false
          load: true
          tags: terrahawk:ci
      - name: Scan image for CVEs (non-blocking)
        continue-on-error: true
        run: docker scout cves terrahawk:ci --only-severity critical,high
